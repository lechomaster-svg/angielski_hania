<style>
/* Layout: single centered column, notebook paper ground, word as row of letter tiles */
:root{
  --paper:#FBFAF5;--line:#DCE6F2;--margin:#F1B8B8;--ink:#1D2B4A;--muted:#5D6A82;
  --tile:#FFFFFF;--tile-edge:#C9D3E3;--accent:#2F5BD3;--accent-ink:#FFFFFF;--hl:#FFE36E;
  --ok:#1E8A55;--ok-soft:#DDF3E6;--bad:#C2413B;--bad-soft:#FBE3E1;
  --display:"Fredoka","Nunito",system-ui,sans-serif;--body:"Nunito",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141B2B;--line:#222C42;--margin:#5A2E35;--ink:#E8EDF7;--muted:#9AA6BD;
  --tile:#1D2639;--tile-edge:#34405A;--accent:#7FA0F7;--accent-ink:#0E1424;--hl:#8A7420;
  --ok:#5BCF92;--ok-soft:#163626;--bad:#F08A84;--bad-soft:#3D1D1D;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141B2B;--line:#222C42;--margin:#5A2E35;--ink:#E8EDF7;--muted:#9AA6BD;
  --tile:#1D2639;--tile-edge:#34405A;--accent:#7FA0F7;--accent-ink:#0E1424;--hl:#8A7420;
  --ok:#5BCF92;--ok-soft:#163626;--bad:#F08A84;--bad-soft:#3D1D1D;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--line) 31px 32px);}
#game{display:flex;flex-direction:column;gap:20px}
main{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px;
  border-left:2px solid var(--margin)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:600;font-size:1.6rem;margin:0;text-wrap:balance}
.who{font:inherit;font-weight:700;font-size:.92rem;padding:6px 12px;border-radius:999px;border:1px solid var(--tile-edge);background:var(--tile);color:var(--ink);cursor:pointer}
.who:hover{border-color:var(--accent)}
.score{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.score b{color:var(--ink)}
.score .g{color:var(--ok)}.score .b{color:var(--bad)}
.status{display:flex;justify-content:space-between;gap:12px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:-12px}
.status .g{color:var(--ok)}.status .b{color:var(--bad)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.pic{font-size:4.2rem;line-height:1;margin:0}
.fix{display:flex;flex-direction:column;align-items:center;gap:8px}
.fixtxt{margin:0;font-family:var(--display);font-weight:600;font-size:1.6rem;color:var(--ok);overflow-wrap:anywhere}
.fixlab{font-weight:700;color:var(--muted)}
.t.sm{width:34px;height:42px;font-size:1.25rem;border-style:solid}
.t.hl{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.sumbig{font-family:var(--display);font-weight:600;font-size:3rem;margin:0;font-variant-numeric:tabular-nums}
#sumList{width:100%;max-width:420px;text-align:left}
.card{display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center;padding-block:8px}
.pl{font-size:1.15rem;color:var(--muted);margin:0}
.pl strong{color:var(--ink);background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 4px}
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 28px;max-width:100%}
@media (max-width:420px){.word{column-gap:20px}}
.part{display:flex;gap:5px}
.t{width:42px;height:52px;border-radius:8px;border:2px solid var(--tile-edge);background:var(--tile);
  font-family:var(--display);font-weight:600;font-size:1.6rem;display:grid;place-items:center;color:var(--ink)}
input.t{text-transform:lowercase;padding:0;text-align:center;border-style:dashed;border-color:var(--accent);caret-color:var(--accent);outline:none}
input.t:focus{border-style:solid;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
input.t.ok{border:2px solid var(--ok);background:var(--ok-soft);color:var(--ok)}
input.t.bad{border:2px solid var(--bad);background:var(--bad-soft);color:var(--bad)}
@media (max-width:420px){.t{width:34px;height:44px;font-size:1.3rem}.part{gap:3px}}
.msg{min-height:1.6em;font-weight:700;margin:0}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:700;border-radius:10px;padding:11px 18px;cursor:pointer;border:2px solid var(--accent);background:transparent;color:var(--accent)}
button.main{background:var(--accent);color:var(--accent-ink)}
button:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.levels{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.modes-lbl,.levels-lbl{margin:0 0 -4px;text-align:center;font-size:.78rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.modes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.modes button{padding:7px 10px;font-size:.88rem;border-color:var(--tile-edge);color:var(--muted)}
.modes button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.sent{font-family:var(--display);font-weight:600;font-size:1.45rem;line-height:1.6;margin:0;text-wrap:balance}
.gap{display:inline-block;min-width:2.6em;padding:0 8px;margin:0 3px;border-bottom:3px dashed var(--accent);color:var(--accent);text-align:center}
.gap.ok{border-bottom-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-soft);border-radius:6px 6px 0 0}
.rank{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--paper);font-variant-numeric:tabular-nums}
.rank li.me{outline:2px solid var(--accent)}
.rank .pos{width:2em;text-align:center;font-weight:700}
.rank .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}
.rank .sc{color:var(--muted)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:440px}
.choices button.choice{font-family:var(--display);font-weight:600;font-size:1.15rem;padding:14px 10px;border:2px solid var(--tile-edge);background:var(--tile);color:var(--ink);border-radius:12px;min-width:0;overflow-wrap:anywhere}
.choices button.choice:disabled{cursor:default}
.choices button.choice.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.choices button.choice.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.dictin{font-family:var(--display);font-weight:600;font-size:1.6rem;text-align:center;width:min(100%,360px);padding:10px 12px;border:2px dashed var(--accent);border-radius:12px;background:var(--tile);color:var(--ink);outline:none;text-transform:lowercase}
.dictin:focus{border-style:solid;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.dictin.ok{border:2px solid var(--ok);background:var(--ok-soft);color:var(--ok)}
.dictin.bad{border:2px solid var(--bad);background:var(--bad-soft);color:var(--bad)}
#rstRow{align-items:center}
#rstRow button.sm{padding:6px 14px;font-size:.9rem;border-color:var(--tile-edge);color:var(--muted)}
.levels button{padding:6px 12px;font-size:.9rem;border-color:var(--tile-edge);color:var(--muted)}
.levels button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
details{background:var(--tile);border:1px solid var(--tile-edge);border-radius:10px;padding:12px 14px}
summary{cursor:pointer;font-weight:700}
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.item{display:flex;gap:8px;align-items:center}
.item span{flex:1;min-width:0;overflow-wrap:anywhere}
.item small{color:var(--muted)}
.item button{padding:4px 10px;font-size:.85rem;border-color:var(--tile-edge);color:var(--bad)}
.add{display:grid;grid-template-columns:1fr 1fr 5.5rem auto;gap:8px;margin-top:12px}
.add input{font:inherit;min-width:0;padding:9px 10px;border-radius:8px;border:1px solid var(--tile-edge);background:var(--paper);color:var(--ink)}
@media (max-width:420px){.add{grid-template-columns:1fr}}
.hint{color:var(--muted);font-size:.9rem;margin:8px 0 0}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .25s ease-out}@keyframes pop{50%{transform:scale(1.08)}}}
</style>

<main>
  <header>
    <button type="button" id="whoBtn" class="who" hidden></button>
  </header>

  <form class="card" id="nameBox" hidden>
    <p class="pl" style="color:var(--ink);font-size:1.3rem;font-family:var(--display)">Jak masz na imię?</p>
    <input id="nameIn" maxlength="30" autocomplete="off" placeholder="Wpisz imię" style="font:inherit;font-size:1.3rem;text-align:center;padding:10px 14px;border-radius:10px;border:2px solid var(--accent);background:var(--tile);color:var(--ink);max-width:100%;width:280px">
    <button class="main" type="submit">Zaczynamy!</button>
  </form>

  <div id="game">
  <div class="status"><span id="qpos"></span><span id="qcnt"></span></div>
  <div class="bar" aria-hidden="true"><span id="prog"></span></div>
  <p class="modes-lbl" id="modesLbl">Wybierz rodzaj gry</p>
  <div class="modes" role="group" aria-labelledby="modesLbl">
    <button type="button" data-mode="letters">Literki</button>
    <button type="button" data-mode="choice">Wybierz</button>
    <button type="button" data-mode="dict">Dyktando</button>
    <button type="button" data-mode="sent">Zdania</button>
  </div>
  <p class="levels-lbl" id="levelsLbl">Wybierz poziom trudności</p>
  <div class="levels" id="levels" role="group" aria-labelledby="levelsLbl">
    <button id="lv1" data-lv="0.3">Łatwy</button>
    <button id="lv2" data-lv="0.5">Średni</button>
    <button id="lv3" data-lv="0.75">Trudny</button>
  </div>

  <section class="card" id="card">
    <p class="pic" id="pic" aria-hidden="true"></p>
    <p class="pl" id="pl"></p>
    <div class="word" id="word"></div>
    <p class="msg" id="msg"></p>
    <div class="fix" id="fix" hidden></div>
    <div class="row">
      <button id="rankNowBtn" hidden>🏆 Dodaj do rankingu</button>
      <button class="main" id="checkBtn">Sprawdź</button>
      <button id="sayBtn">Posłuchaj</button>
      <button id="nextBtn">Pomiń</button>
    </div>
  </section>

  <div class="row" id="rstRow"></div>

  <section class="card" id="summary" hidden>
    <p class="pl" id="sumTitle">Koniec rundy</p>
    <p class="sumbig" id="sumBig"></p>
    <p class="pl" id="sumTxt"></p>
    <p class="msg ok" id="sumCongrats" hidden></p>
    <p class="fixlab" id="sumWrongHead" hidden>Te słówka były źle:</p>
    <div class="list" id="sumList"></div>
    <div class="row">
      <button class="main" id="repWrong">Powtórz złe słówka</button>
      <button id="newRound">Nowa runda (wszystkie)</button>
    </div>
    <div class="row" id="rankSendRow" hidden><button id="rankSend">🏆 Dodaj wynik do rankingu</button></div>
    <p class="hint" id="rankSendMsg" hidden></p>
  </section>

  <details id="rankBox" hidden>
    <summary>🏆 Ranking</summary>
    <div class="modes" id="rankTabs" style="margin-top:12px">
      <button type="button" data-rm="letters">Literki</button>
      <button type="button" data-rm="choice">Wybierz</button>
      <button type="button" data-rm="dict">Dyktando</button>
      <button type="button" data-rm="sent">Zdania</button>
    </div>
    <ol class="rank" id="rankList"></ol>
    <p class="hint" id="rankInfo"></p>
  </details>

  </div>
  <p class="hint" style="text-align:center;margin:0">wersja 6.10 · 19:45<br>Marcin Lechowicz</p>
</main>

function buildChoice(){hidden=[];const others=shuffle(S.words.filter(x=>x[0].toLowerCase()!==cur[0].toLowerCase()).map(x=>x[0])).slice(0,3);
  const box=document.createElement("div");box.className="choices";
  shuffle([cur[0],...others]).forEach(o=>{const b=document.createElement("button");b.type="button";b.className="choice";b.textContent=o;b.onclick=()=>pickChoice(b,o);box.appendChild(b)});
  $("word").appendChild(box);$("checkBtn").hidden=true;$("nextBtn").hidden=false}
function ans(){return cur[3]?cur[3].a:cur[0]}
function pickChoice(b,o){if(checked||!cur)return;checked=true;const ok=o===ans();
  document.querySelectorAll("#word .choice").forEach(x=>{x.disabled=true;if(x.textContent===ans())x.classList.add("ok")});if(!ok)b.classList.add("bad");finish(ok)}
function buildDict(){hidden=[];[...cur[0]].forEach((c,i)=>{if(/[a-z]/i.test(c))hidden.push(i)});
  $("pic").hidden=true;$("pl").textContent="Posłuchaj i napisz całe słowo po angielsku:";
  const inp=document.createElement("input");inp.className="dictin";inp.id="dictIn";inp.autocomplete="off";inp.spellcheck=false;
  inp.setAttribute("autocapitalize","off");inp.setAttribute("autocorrect","off");inp.setAttribute("aria-label","Wpisz słowo");$("word").appendChild(inp);
  setTimeout(()=>{inp.focus({preventScroll:true});say()},150)}
function norm(t){return String(t).toLowerCase().replace(/\s+/g," ").trim()}
function lastRankBtn(){const R=S.round;$("rankNowBtn").hidden=!(RANK.url&&!R.queue.length&&!R.repeat&&!R.sent&&R.total>=5)}
function finish(ok){record(ok);$("sayBtn").hidden=false;lastRankBtn();if(cur[3]&&$("gap")){$("gap").textContent=cur[3].a;$("gap").className="gap ok"}else if(S.mode==="dict")showHint();
  const m=$("msg");m.className="msg "+(ok?"ok":"bad")+" pop";
  m.textContent=ok?"Brawo, "+(S.name||"")+"!":"Prawie! Zobacz poprawną odpowiedź:";
  if(!ok)showFix();
  $("checkBtn").hidden=false;$("checkBtn").textContent=S.round.queue.length?"Dalej":"Zobacz wynik";$("nextBtn").hidden=true;if(ok){say();praise()}else say()}
function inputs(){return [...$("word").querySelectorAll("input")]}
$("word").addEventListener("input",e=>{const t=e.target;if(t.tagName!=="INPUT"||t.id==="dictIn")return;
  t.value=t.value.slice(-1).toLowerCase();t.classList.remove("ok","bad");
  if(t.value){const a=inputs();const k=a.indexOf(t);if(a[k+1])a[k+1].focus();else check()}});
$("word").addEventListener("keydown",e=>{const t=e.target;if(t.tagName!=="INPUT")return;if(t.id==="dictIn"){if(e.key==="Enter"){e.preventDefault();check()}return}
  if(e.key==="Backspace"&&!t.value){const a=inputs();const k=a.indexOf(t);if(a[k-1]){a[k-1].focus();a[k-1].value=""}e.preventDefault()}
  if(e.key==="Enter"){e.preventDefault();check()}});

function record(ok){const R=S.round;if(ok)R.good++;else{R.bad++;const k=cur[3]?cur[3].t:cur[0];if(!R.wrong.includes(k))R.wrong.push(k)}save();renderScore()}
function showFix(){const f=$("fix");f.innerHTML="";const tx=document.createElement("p");tx.className="fixtxt";tx.textContent=cur[0];f.appendChild(tx);if(S.mode==="choice"||cur[3]){f.hidden=false;return}const lab=document.createElement("span");lab.className="fixlab";lab.textContent="Poprawnie:";f.appendChild(lab);
  const box=document.createElement("div");box.className="word";let part=null;
  [...cur[0]].forEach((c,i)=>{if(c===" "||!part){part=document.createElement("div");part.className="part";box.appendChild(part);if(c===" ")return}
    const d=document.createElement("div");d.className="t sm"+(hidden.includes(i)?" hl":"");d.textContent=c;part.appendChild(d)});
  f.appendChild(box);f.hidden=false}
function check(){if(!cur)return;if(checked){nextWord();return}
  if(S.mode==="choice")return;
  if(S.mode==="dict"){const inp=$("dictIn");if(!norm(inp.value)){$("msg").textContent="Wpisz słowo.";$("msg").className="msg";inp.focus();return}
    const ok=norm(inp.value)===norm(cur[0]);inp.classList.add(ok?"ok":"bad");inp.readOnly=true;checked=true;finish(ok);return}
  const a=inputs();if(a.some(x=>!x.value)){$("msg").textContent="Uzupełnij wszystkie puste pola.";$("msg").className="msg";return}
  const word=cur[0];let ok=true;
  a.forEach(x=>{const r=x.value===word[+x.dataset.i].toLowerCase();x.classList.add(r?"ok":"bad");x.readOnly=true;if(!r)ok=false});
  checked=true;finish(ok)}
function skip(){if(!cur||checked)return;checked=true;record(false);$("sayBtn").hidden=false;lastRankBtn();
  inputs().forEach(x=>{x.readOnly=true;x.classList.add("bad")});
  document.querySelectorAll("#word .choice").forEach(x=>{x.disabled=true;if(x.textContent===ans())x.classList.add("ok")});
  if(cur[3]&&$("gap")){$("gap").textContent=cur[3].a;$("gap").className="gap ok"}
  if(S.mode==="dict"&&!cur[3])showHint();$("checkBtn").hidden=false;
  const m=$("msg");m.className="msg bad";m.textContent="Pominięte. Poprawnie:";showFix();
  $("checkBtn").textContent=S.round.queue.length?"Dalej":"Zobacz wynik";$("nextBtn").hidden=true}

function showSummary(){const R=S.round;try{if(window.goatcounter&&goatcounter.count)goatcounter.count({path:R.repeat?"runda-powtorka-ukonczona":"runda-ukonczona",title:"Runda ukończona",event:true})}catch(e){}$("card").hidden=true;$("summary").hidden=false;renderScore();
  const pct=R.total?Math.round(R.good/R.total*100):0;
  $("sumBig").textContent=R.good+" / "+R.total;
  $("sumTitle").textContent=R.repeat?"Koniec powtórki złych słówek":"Koniec rundy";
  $("sumTxt").textContent="dobrze "+R.good+", źle "+R.bad+" ("+pct+"%)"+(R.repeat&&R.main?" · cała runda: "+R.main.good+" / "+R.main.total:"");
  const l=$("sumList");l.innerHTML="";
  const wr=R.wrong.map(findWord).filter(Boolean);
  $("sumWrongHead").hidden=!wr.length;
  wr.forEach(w=>{const r=document.createElement("div");r.className="item";const sp=document.createElement("span");
    sp.textContent=(w[2]?picText(w[2])+"  ":"")+w[0]+" ";const sm=document.createElement("small");sm.textContent="– "+w[1];sp.appendChild(sm);r.appendChild(sp);l.appendChild(r)});
  $("repWrong").hidden=!wr.length;$("repWrong").textContent="Powtórz złe słówka ("+wr.length+")";
  $("sumCongrats").hidden=!!wr.length;
  $("sumCongrats").textContent=R.repeat?"Wszystkie złe słówka poprawione, "+(S.name||"")+"!":"Cała runda bez błędu, "+(S.name||"")+"! Super!";
  const canRank=!!RANK.url&&!R.repeat&&R.total>=5;$("rankSendRow").hidden=!canRank||!!R.sent;$("rankSendMsg").hidden=!R.sent;
  if(R.sent)$("rankSendMsg").textContent="Wynik jest już w rankingu.";
  $("rankSend").disabled=false;$("rankSend").textContent="🏆 Dodaj wynik do rankingu";}
$("repWrong").onclick=()=>{const k=S.round.kind||"words";const wr=S.round.wrong.map(findWord).filter(Boolean);startRound(wr,true,k)};
$("newRound").onclick=()=>freshRound();
function rstUI(ask){const r=$("rstRow");r.innerHTML="";
  const mk=(t,cls,fn)=>{const b=document.createElement("button");b.type="button";b.textContent=t;if(cls)b.className=cls;b.onclick=fn;r.appendChild(b);return b};
  if(ask){const q=document.createElement("span");q.className="fixlab";q.textContent="Zacząć od nowa? Wynik tej rundy się wyzeruje.";r.appendChild(q);
    mk("Tak, od nowa","main",()=>{rstUI(false);freshRound()});mk("Anuluj","",()=>rstUI(false))}
  else mk("Zacznij od nowa","sm",()=>rstUI(true))}
rstUI(false);

function praise(){try{const u=new SpeechSynthesisUtterance("Brawo, "+(S.name||"")+"!");u.lang="pl-PL";u.pitch=1.5;u.rate=1.05;u.volume=1;
  const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith("pl"));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function say(){try{const u=new SpeechSynthesisUtterance(cur[0]);u.lang="en-GB";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

function renderScore(){const R=S.round;if(!R){$("qpos").textContent="";$("qcnt").textContent="";$("prog").style.width="0";return}
  const done=R.good+R.bad;
  const pos=Math.min(done+(cur&&!checked?1:0),R.total);
  $("qpos").textContent=(R.repeat?"Powtórka: ":"")+"Pytanie "+pos+" z "+R.total;
  $("qcnt").innerHTML=`<span class="g">✓ ${R.good}</span> &nbsp; <span class="b">✗ ${R.bad}</span>`;
  $("prog").style.width=(R.total?done/R.total*100:0)+"%"}
function renderLevels(){document.querySelectorAll(".levels button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.lv===S.lv)))}
function renderList(){}
function renderModes(){if(!["letters","choice","dict","sent"].includes(S.mode))S.mode="letters";
  document.querySelectorAll(".modes button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mode===S.mode)));$("levels").hidden=$("levelsLbl").hidden=S.mode!=="letters"}
document.querySelectorAll(".modes button").forEach(b=>b.onclick=()=>{const was=!!(S.round&&S.round.kind==="sent");S.mode=b.dataset.mode;save();renderModes();if(was!==(S.mode==="sent"))freshRound();else if(cur&&!checked)buildWord()});
/* ---- shared online ranking (Supabase) ---- */
const RANK={url:"https://gmrkbgttpmyutjetotqb.supabase.co",key:"sb_publishable_YY9S71fMeWZBeNvc7QrDww_A_SQ6PKc"};
const RM_LABEL={letters:"Literki",choice:"Wybierz",dict:"Dyktando",sent:"Zdania"};
let rankMode="letters",rankReq=0,rankNext=null;
function rankHeaders(){return RANK.key.startsWith("eyJ")?{apikey:RANK.key,Authorization:"Bearer "+RANK.key}:{apikey:RANK.key}}
async function loadRank(mode){rankMode=mode;document.querySelectorAll("#rankTabs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.rm===mode)));
  const l=$("rankList"),info=$("rankInfo"),my=++rankReq;l.innerHTML="";info.textContent="Wczytuję…";
  try{const r=await fetch(RANK.url+"/rest/v1/scores?select=name,good,total,created_at&mode=eq."+mode+"&order=created_at.asc&limit=2000",{headers:rankHeaders()});
    if(!r.ok)throw new Error(r.status);const rows=await r.json();if(my!==rankReq)return;l.innerHTML="";const best={};
    rows.forEach(x=>{const k=x.name.trim().toLowerCase();const pct=x.good/x.total;const b=best[k];
      if(!b||pct>b.pct||(pct===b.pct&&x.total>b.total))best[k]={name:x.name.trim(),good:x.good,total:x.total,pct}});
    const top=Object.values(best).sort((a,b)=>b.pct-a.pct||b.total-a.total).slice(0,10);
    const medal=["🥇","🥈","🥉"];const me=(S.name||"").trim().toLowerCase();
    let place=0;top.forEach((x,i)=>{if(i===0||x.pct!==top[i-1].pct||x.total!==top[i-1].total)place=i+1;const li=document.createElement("li");if(x.name.toLowerCase()===me)li.className="me";
      const a=document.createElement("span");a.className="pos";a.textContent=medal[place-1]||String(place);
      const n=document.createElement("span");n.className="nm";n.textContent=x.name;
      const sc=document.createElement("span");sc.className="sc";sc.textContent=x.good+"/"+x.total+" ("+Math.round(x.pct*100)+"%)";
      li.append(a,n,sc);l.appendChild(li)});
    info.textContent=top.length?"Liczy się najlepszy wynik każdej osoby w trybie „"+RM_LABEL[mode]+"”.":"Brak wyników w trybie „"+RM_LABEL[mode]+"”. Ukończ rundę i dodaj wynik jako pierwszy!"}
  catch(e){if(my!==rankReq)return;info.textContent="Nie udało się wczytać rankingu. Sprawdź połączenie z internetem."}}
async function sendRank(){const R=S.round;if(!R||R.sent||!RANK.url)return;const b=$("rankSend");b.disabled=true;b.textContent="Wysyłam…";
  const mode=R.kind==="sent"?"sent":(S.mode==="sent"?"letters":S.mode);
  try{const r=await fetch(RANK.url+"/rest/v1/scores",{method:"POST",headers:Object.assign({"Content-Type":"application/json",Prefer:"return=minimal"},rankHeaders()),
      body:JSON.stringify({name:(S.name||"Gość").trim().slice(0,20),mode,good:R.good,total:R.total})});
    if(!r.ok)throw new Error(r.status);R.sent=true;save();$("rankSendRow").hidden=true;const m=$("rankSendMsg");m.hidden=false;m.textContent="Dodano do rankingu! Zobacz niżej.";
    const box=$("rankBox");if(box.open)loadRank(mode);else{rankNext=mode;box.open=true}}
  catch(e){b.disabled=false;b.textContent="Nie udało się. Spróbuj ponownie"}}
if(RANK.url){$("rankBox").hidden=false;$("rankBox").addEventListener("toggle",()=>{if($("rankBox").open){loadRank(rankNext||(S.mode in RM_LABEL?S.mode:"letters"));rankNext=null}});
  document.querySelectorAll("#rankTabs button").forEach(b=>b.onclick=()=>loadRank(b.dataset.rm));$("rankSend").onclick=sendRank;$("rankNowBtn").onclick=()=>{$("rankNowBtn").hidden=true;nextWord();sendRank()}}
function renderAll(){renderModes();renderScore();renderLevels();renderList()}

$("checkBtn").onclick=check;$("nextBtn").onclick=skip;$("sayBtn").onclick=()=>{if(cur&&(checked||S.mode==="dict"))say()};
document.querySelectorAll(".levels button").forEach(b=>b.onclick=()=>{S.lv=+b.dataset.lv;save();renderLevels();if(cur&&!checked)buildWord()});

function showName(){const has=!!S.name;$("nameBox").hidden=has;$("game").hidden=!has;$("whoBtn").hidden=!has;if(has)$("whoBtn").textContent="👤 "+S.name+" · zmień";if(!has){$("nameIn").value="";setTimeout(()=>$("nameIn").focus(),50)}}
$("nameBox").addEventListener("submit",e=>{e.preventDefault();const n=$("nameIn").value.trim();if(!n){$("nameIn").focus();return}
  S.name=n.charAt(0).toUpperCase()+n.slice(1);save();showName();resume()});
function changeName(){S.name="";S.round=null;cur=null;save();showName()}
$("whoBtn").onclick=changeName;
renderAll();showName();if(S.name)resume();
</script>

</body>
